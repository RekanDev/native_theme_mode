name: native_theme_mode
description: >-
  Sync Flutter ThemeMode to native Android night mode and iOS UI style so
  Android 12+ splash follows the in-app theme on the next cold start.
version: 0.2.0
homepage: https://github.com/RekanDev/native_theme_mode
repository: https://github.com/RekanDev/native_theme_mode
issue_tracker: https://github.com/RekanDev/native_theme_mode/issues
topics:
  - theme
  - splash
  - android
  - night-mode
  - theme-mode

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'

flutter:
  plugin:
    platforms:
      android:
        package: dev.rekan.native_theme_mode
        pluginClass: NativeThemeModePlugin
      ios:
        pluginClass: NativeThemeModePlugin

screenshots:
  - description: Manual light and dark theme switching with splash persistence on cold start.
    path: assets/demo.gif
  - description: System theme mode following device light and dark changes.
    path: assets/demo_system.gif